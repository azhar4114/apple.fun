<!DOCTYPE html>
<html>
  <head>
	  <script src="validate.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.6/angular.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.0.1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('images/clouds2.jpeg');
      background-size: cover;
      background-attachment: fixed;
    }

    .button {
      padding: 0;
      font-size: 2.3vh;
      flex-direction: column;
    }

    .shapes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(30vh, 1fr));
      gap: 3vh;
      width: 100%;
      padding: 0 4vh;
    }

    .shape-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .shape-card h2 {
      margin: 0 0 15px 0;
      font-size: 4vh;
      font-weight: 800;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    .shape-box {
      width: 25vh;
      height: 25vh;
      margin-bottom: 1vh;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    #alphabet {
      grid-template-columns: repeat(auto-fit, minmax(32vh, 1fr));
    }
  </style>
  </head>
<body ng-app="newApp">
  
  <div ng-controller="appCtrl" id="controller">
   <div class="header">
    <h1>Learn Seasons of the Year</h1>
    <a href="index.html">Go to Home</a>
  </div>
  <div class="toggle-buttons">
   <button class="toggle-button play active">Play</button>
  </div>
  <loader id="loader"></loader>
    <div id="alphabet" class="shapes-grid">
      <div class="button ng-cloak" ng-repeat="s in shapes" data="{{$index}}">
        <div>
        <div class="shape-card" >
          <h2>{{s}}</h2>
          <div class="shape-box" ng-style="{'background-image': 'url(images/' + s + '.jpeg)'}"></div>
        </div>
      </div>
      </div>
      
    </div>
      
    </div>
<button id="scrollToTopBtn" title="Go to top">Top</button>
<script src="script.js"></script>
  <script>
var aud;
var audTime = [];
gap = 2300;
var app = angular.module("newApp", []);

app.directive('loader', function($http, $templateCache) {
  return {
    restrict: 'E',
    link: function(scope, element) {
      // Load the loader.html file and inject it
      $http.get('loader.html', { cache: $templateCache }).then(function(response) {
        element.html(response.data);
      });
    }
  };
});

app.controller('appCtrl', function($scope, $timeout) {
  $scope.shapes = [];
  $scope.showSmallClck = function(){
    //$scope.aud.play();
	  $scope.ctrl.showSmall = !$scope.ctrl.showSmall;
    if(!$scope.ctrl.showSmall && !$scope.ctrl.showCaps)
      $scope.ctrl.showCaps = true;
  };
  
  $scope.initiate = function(data){
 	 aud = new Audio(data.aud);
     aud.load();
 	 audTime = data.audTime;
  	 $('#loader').hide();
 	 $scope.shapes = data.chars;

     $timeout(function() {
         if (typeof attachListeners === 'function') attachListeners();
     }, 500);
  }
  
}); 

  </script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-1ZCM5PW9N9');
</script>
</body>
</html>
