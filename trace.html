<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Tracing</title>
  <script>
    window.AFORAPPLE_SAMPLE_DATA = {
      hind: [
        { c: "अ" },
        { c: "आ" },
        { c: "इ" },
        { c: "ई" },
        { c: "उ" },
        { c: "ए" },
        { c: "क" },
        { c: "ग" },
        { c: "च" },
        { c: "ट" }
      ],
      telu: [
        { c: "అ" },
        { c: "ఆ" },
        { c: "ఇ" },
        { c: "ఈ" },
        { c: "ఉ" },
        { c: "ఎ" },
        { c: "క" },
        { c: "గ" },
        { c: "చ" },
        { c: "ట" }
      ],
      bg: ["flowersbg.jpeg", "rainbow1.jpeg", "straw.jpeg"]
    };
  </script>
  <script src="pilot-utils.js"></script>
  <script src="validate.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.6/angular.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.0.1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('images/space1.jpeg');
      background-size: cover;
      background-attachment: fixed;
    }

    canvas {
      border: none;
      border-radius: 16px;
      background-color: rgba(255, 255, 255, 0.95);
      margin-top: 20px;
      cursor: crosshair;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-bottom: 20px;
    }

    .game {
      margin: 4vh auto;
      padding: 4vh;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(10, 15, 30, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
      width: 90%;
      max-width: 600px;
      text-align: center;
      color: #fff;
    }

    .game h2 {
      margin-bottom: 15px;
      font-size: 3vh;
      font-weight: 700;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sample-banner {
      margin: 2vh 4vh 4vh;
      padding: 3vh;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      color: #fff;
      text-align: center;
      font-size: 2.2vh;
      font-weight: 600;
    }

    .sample-banner a {
      color: #ff9a9e;
      font-weight: 800;
      text-decoration: underline;
    }

    .trace-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    select {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 2.5vh;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 10px;
      text-align: center;
    }

    select option {
      background: #1a2238;
      color: white;
    }

    .trace-button {
      background: rgba(10, 15, 30, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 2.2vh;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .trace-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      background: rgba(20, 25, 45, 0.7);
    }
  </style>
</head>
<body ng-app="newApp">
  <div class="header">
    <h1>Letter Tracing</h1>
    <a href="index.html">Go to Home</a>
  </div>

  <div class="sample-banner" data-access-badge-target>
    Public sample lesson. Test tracing on a shared tablet or touchscreen, then <a href="contact.html">request the full
    school pilot</a>.
  </div>

  <loader id="loader"></loader>
  <div ng-controller="appCtrl" class="container" id="controller">
    <div class="toggle-buttons">
      <button class="toggle-button active" ng-class="{'active':ctrl.eng}" ng-click="setLang('eng')">English</button>
      <button class="toggle-button" ng-class="{'active':ctrl.hin}" ng-click="setLang('hin')">Hindi</button>
      <button class="toggle-button" ng-class="{'active':ctrl.tel}" ng-click="setLang('tel')">Telugu</button>
    </div>
    <div class="game">
      <div id="english" ng-show="ctrl.eng">
        <select id="letterSelectEnglish" ng-change="drawLetter(ctrl.el)" ng-model="ctrl.el">
          <option value="">Select a letter</option>
          <option value="{{c}}" ng-repeat="c in chars">{{c}}</option>
        </select>
      </div>
      <div id="hindi" ng-show="ctrl.hin">
        <select id="letterSelectHindi" ng-change="drawLetter(ctrl.hl)" ng-model="ctrl.hl">
          <option value="">Select a letter</option>
          <option value="{{c.c}}" ng-repeat="c in hind">{{c.c}}</option>
        </select>
      </div>
      <div id="telugu" ng-show="ctrl.tel">
        <select id="letterSelectTelugu" ng-change="drawLetter(ctrl.tl)" ng-model="ctrl.tl">
          <option value="">Select a letter</option>
          <option value="{{c.c}}" ng-repeat="c in telu">{{c.c}}</option>
        </select>
      </div>
      <canvas id="tracingCanvas" width="400" height="400"></canvas>
      <div class="trace-actions">
        <button class="trace-button" type="button" id="clear-trace">Clear trace</button>
      </div>
    </div>
  </div>
  <button id="scrollToTopBtn" title="Go to top">Top</button>

  <script>
    var app = angular.module("newApp", []);

    app.directive("loader", function($http, $templateCache) {
      return {
        restrict: "E",
        link: function(scope, element) {
          $http.get("loader.html", { cache: $templateCache }).then(function(response) {
            element.html(response.data);
          });
        }
      };
    });

    app.controller("appCtrl", function($scope) {
      $scope.ctrl = { eng: true, hin: false, tel: false, el: "", tl: "", hl: "" };
      $scope.hind = [];
      $scope.telu = [];
      $scope.chars = [];

      $scope.populatePage = function() {
        var i;
        var C = "";
        $scope.chars = [];
        for (i = 0; i < 26; i++) {
          C = String.fromCharCode(65 + i);
          $scope.chars.push(C);
        }
      };

      $scope.initiate = function(data) {
        $scope.hind = data.hind;
        $scope.telu = data.telu;
        $("#loader").hide();
        $scope.populatePage();
      };

      $scope.setLang = function(l) {
        $scope.ctrl.eng = false;
        $scope.ctrl.hin = false;
        $scope.ctrl.tel = false;
        $scope.ctrl[l] = true;
        if (l === "eng") {
          $scope.drawLetter($scope.ctrl.el);
        } else if (l === "hin") {
          $scope.drawLetter($scope.ctrl.hl);
        } else if (l === "tel") {
          $scope.drawLetter($scope.ctrl.tl);
        }
      };

      var tracingCanvas = document.getElementById("tracingCanvas");
      var ctx = tracingCanvas.getContext("2d");
      var clearButton = document.getElementById("clear-trace");
      var drawing = false;

      function resetCanvas() {
        ctx.clearRect(0, 0, tracingCanvas.width, tracingCanvas.height);
      }

      function startDrawing(event) {
        drawing = true;
        draw(event);
      }

      function stopDrawing() {
        drawing = false;
        ctx.beginPath();
      }

      function draw(event) {
        if (!drawing) {
          return;
        }

        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#000";

        var x;
        var y;

        if (event.type && event.type.indexOf("touch") !== -1) {
          var touch = event.touches[0];
          var rect = tracingCanvas.getBoundingClientRect();
          x = touch.clientX - rect.left;
          y = touch.clientY - rect.top;
        } else {
          var mouseRect = tracingCanvas.getBoundingClientRect();
          x = event.clientX - mouseRect.left;
          y = event.clientY - mouseRect.top;
        }

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);

        event.preventDefault();
      }

      $scope.drawLetter = function(letter) {
        resetCanvas();
        ctx.font = "200px Arial";
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(letter || "", tracingCanvas.width / 2, tracingCanvas.height / 2);
      };

      tracingCanvas.addEventListener("mousedown", startDrawing);
      tracingCanvas.addEventListener("mouseup", stopDrawing);
      tracingCanvas.addEventListener("mouseout", stopDrawing);
      tracingCanvas.addEventListener("mousemove", draw);
      tracingCanvas.addEventListener("touchstart", startDrawing);
      tracingCanvas.addEventListener("touchend", stopDrawing);
      tracingCanvas.addEventListener("touchcancel", stopDrawing);
      tracingCanvas.addEventListener("touchmove", draw);

      clearButton.addEventListener("click", function() {
        if ($scope.ctrl.eng) {
          $scope.drawLetter($scope.ctrl.el);
        } else if ($scope.ctrl.hin) {
          $scope.drawLetter($scope.ctrl.hl);
        } else {
          $scope.drawLetter($scope.ctrl.tl);
        }
      });
    });
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1ZCM5PW9N9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "G-1ZCM5PW9N9");
  </script>
</body>
</html>
