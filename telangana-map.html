<!DOCTYPE html>
<html>
  <head>
	  <script src="validate.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.6/angular.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.0.1"></script>
	
    <title>Interactive Telangana Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-image: url('images/space1.jpeg');
        background-size: cover;
        background-attachment: fixed;
      }

      .container {
        display: flex;
        justify-content: center;
        padding: 2vh;
        max-width: 1600px;
        margin: 0 auto;
      }

      .map-wrapper {
        background: rgba(10, 15, 30, 0.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        width: 100%;
        overflow: hidden;
      }

      #map {
        width: 100%;
        height: auto;
        border-radius: 15px;
        cursor: grab;
      }

      #map:active {
        cursor: grabbing;
      }

      .country {
        fill: rgba(255, 255, 255, 0.15);
        stroke: rgba(255, 255, 255, 0.4);
        stroke-width: 0.5px;
        transition: fill 0.2s ease, stroke-width 0.2s ease;
      }

      .country:hover {
        fill: #ff9a9e;
        stroke: #fff;
        stroke-width: 1.5px;
        filter: drop-shadow(0 0 8px rgba(255, 154, 158, 0.8));
      }

      .country-label {
        font-family: 'Inter', sans-serif;
        fill: rgba(255, 255, 255, 0.9);
        pointer-events: none;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      }

      #map-tooltip {
        position: absolute;
        background: rgba(10, 15, 30, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 10px 18px;
        font-family: 'Inter', sans-serif;
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        pointer-events: none;
        display: none;
        transform: translate(-50%, -120%);
        white-space: nowrap;
        z-index: 100;
      }

      #hud {
        text-align: center;
        margin-top: 15px;
        font-size: 3.5vh;
        font-weight: 700;
        color: #fecfef;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        min-height: 5vh;
      }
    </style>
  </head>
<body ng-app="newApp">
  
  <div ng-controller="appCtrl" id="controller">
   <div class="header">
    <h1>Interactive Telangana Map</h1>
    <a href="index.html">Go to Home</a>
  </div>
  <loader id="loader"></loader>
  <div class="container">
    <div class="map-wrapper">
      <svg id="map" viewBox="0 0 1200 800"></svg>
      <div id="hud">Explore Telangana!</div>
    </div>
  </div>
  <div id="map-tooltip"></div>
  <button id="scrollToTopBtn" title="Go to top">Top</button>

<script src="script.js"></script>
<script>

  var aud;
  var audTime = [];
  gap = 1200;

  var app = angular.module("newApp", []);
  app.directive('loader', function($http, $templateCache) {
    return {
      restrict: 'E',
      link: function(scope, element) {
        $http.get('loader.html', { cache: $templateCache }).then(function(response) {
          element.html(response.data);
        });
      }
    };
  });

  app.controller('appCtrl', function($scope) {
    $scope.initiate = function(data){
      $('#loader').hide();
      
      const width = 1200;
      const height = 800;

      const svg = d3.select('#map');
      const g = svg.append('g'); 

      const tooltip = d3.select('#map-tooltip');
      const hud = d3.select('#hud');

      const zoom = d3.zoom()
        .scaleExtent([1, 8]) 
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });

      svg.call(zoom);

      if (data && data.json) {
        d3.json(data.json)
          .then((mapData) => {
            const projection = d3.geoMercator();
            const path = d3.geoPath().projection(projection);

            // Fit projection automatically to features
            projection.fitSize([width, height], mapData);

            // Draw the map
            g.selectAll('path')
              .data(mapData.features)
              .enter()
              .append('path')
              .attr('d', path)
              .attr('class', 'country')
              .on('mouseover', function (event, d) {
                tooltip.style('display', 'block').text(d.properties.name || d.properties.district || "Region");
              })
              .on('mousemove', (event) => {
                tooltip
                  .style('left', `${event.pageX}px`)
                  .style('top', `${event.pageY}px`);
              })
              .on('mouseout', function () {
                tooltip.style('display', 'none');
              })
              .on('click', (event, d) => {
                const name = d.properties.name || d.properties.district || "Region";
                hud.text(`Selected: ${name}`);
                if (typeof explodeConfetti === 'function') explodeConfetti();
              });

            // Add labels
            g.selectAll('text')
              .data(mapData.features)
              .enter()
              .append('text')
              .attr('x', d => projection(d3.geoCentroid(d))[0])
              .attr('y', d => projection(d3.geoCentroid(d))[1])
              .attr('text-anchor', 'middle')
              .attr('class', 'country-label')
              .attr('font-size', '14px')
              .text(d => d.properties.name || d.properties.district);
          })
          .catch((error) => console.error('Error loading the map:', error));
      }
    }
  }); 
</script>

</body>
</html>
