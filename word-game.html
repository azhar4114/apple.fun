<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Builder Game</title>
  <script src="validate.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.6/angular.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.0.1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('images/space1.jpeg');
      background-size: cover;
      background-attachment: fixed;
      color: #fff;
    }

    .game-shell {
      width: min(920px, calc(100% - 24px));
      margin: 0 auto 40px;
    }

    .panel {
      margin-top: 20px;
      padding: 30px;
      border-radius: 24px;
      background: rgba(10, 15, 30, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
      color: #fff;
    }

    .target-word {
      font-size: 42px;
      font-weight: 800;
      color: #ff9a9e;
      letter-spacing: 0.1em;
      text-align: center;
      margin: 12px 0 20px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }

    .helper-copy {
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: 18px;
      line-height: 1.6;
    }

    .letter-bank,
    .placed-letters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
    }

    .letter-chip {
      min-width: 58px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .letter-chip:hover {
      transform: scale(1.1) translateY(-3px);
      background: rgba(255, 255, 255, 0.3);
      border-color: #ff9a9e;
      box-shadow: 0 8px 25px rgba(255, 154, 158, 0.5);
    }

    .dropzone {
      margin-top: 20px;
      padding: 24px;
      min-height: 130px;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.3);
      text-align: center;
      transition: all 0.3s ease;
    }

    .dropzone.hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #ff9a9e;
    }

    .dropzone p {
      margin: 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 20px;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    .btn {
      padding: 12px 25px;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(45deg, #a18cd1 0%, #fbc2eb 100%);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(251, 194, 235, 0.6);
    }

    #clear-word-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    #clear-word-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #next-word-btn {
      background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 100%);
      color: #333;
    }

    .message {
      font-size: 22px;
      margin-top: 20px;
      font-weight: 800;
      text-align: center;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    .correct {
      color: #a8ff78;
    }

    .incorrect {
      color: #ff9a9e;
    }

    .sample-note {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 16px;
    }
  </style>
</head>
<body ng-app="newApp">
  <div class="game-shell" ng-controller="appCtrl" id="controller">
    <div class="header">
      <h1>Word Builder Game</h1>
      <a href="index.html">Go to Home</a>
    </div>
    <loader id="loader"></loader>

    <div class="panel">
      <div class="helper-copy">Build the target word by tapping letters or dragging them into the answer box.</div>
      <div class="target-word" id="target-word">APPLE</div>

      <div id="draggable-letters" class="letter-bank"></div>

      <div class="dropzone" id="word-dropzone">
        <p>Tap a letter or drag it here to build the word.</p>
        <div class="placed-letters" id="placed-letters"></div>
      </div>

      <div class="controls">
        <button class="btn" id="check-word-btn" type="button">Check Word</button>
        <button class="btn" id="clear-word-btn" type="button">Reset</button>
        <button class="btn" id="next-word-btn" type="button">Next Word</button>
      </div>

      <div class="message" id="game-message"></div>
      <div class="sample-note" id="sample-note" style="display: none;">Sample lesson preview mode enabled.</div>
    </div>
  </div>
  <button id="scrollToTopBtn" title="Go to top">Top</button>
  <script src="script.js"></script>

  <script>
    var draggableContainer = document.getElementById("draggable-letters");
    var dropzone = document.getElementById("word-dropzone");
    var placedLetters = document.getElementById("placed-letters");
    var targetWordEl = document.getElementById("target-word");
    var checkWordButton = document.getElementById("check-word-btn");
    var clearWordButton = document.getElementById("clear-word-btn");
    var nextWordButton = document.getElementById("next-word-btn");
    var feedbackMessage = document.getElementById("feedback-message");

    var starterWords = [
      "apple",
      "book",
      "cat",
      "dog",
      "fish",
      "leaf",
      "milk",
      "moon",
      "pen",
      "rain",
      "star",
      "sun",
      "tree",
      "bus",
      "nest",
      "frog"
    ];
    var correctWords = [];
    var currentWordIndex = 0;

    var app = angular.module("newApp", []);
    app.directive("loader", function($http, $templateCache) {
      return {
        restrict: "E",
        link: function(scope, element) {
          $http.get("loader.html", { cache: $templateCache }).then(function(response) {
            element.html(response.data);
          });
        }
      };
    });

    app.controller("appCtrl", function($scope) {
      $scope.initiate = function(data) {
        var incomingWords = (data && data.words ? data.words : []).map(function(word) {
          return String(word || "").toLowerCase().replace(/[^a-z]/g, "");
        });

        correctWords = starterWords.concat(incomingWords).filter(function(word, index, arr) {
          return word && arr.indexOf(word) === index;
        });

        currentWordIndex = 0;
        $("#loader").hide();
        renderCurrentWord();
      };
    });

    function shuffle(list) {
      for (var i = list.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = list[i];
        list[i] = list[j];
        list[j] = temp;
      }
      return list;
    }

    function currentWord() {
      return correctWords[currentWordIndex] || "apple";
    }

    function renderCurrentWord() {
      var word = currentWord();
      targetWordEl.textContent = word.toUpperCase();
      clearPlacedLetters();
      populateLetters(word);
      feedbackMessage.textContent = "";
      feedbackMessage.className = "message";
    }

    function distractorLetters(word) {
      var pool = correctWords.join("").split("").filter(function(letter) {
        return word.indexOf(letter) === -1;
      });

      if (!pool.length) {
        pool = ["a", "e", "i", "o", "u"];
      }

      shuffle(pool);
      return pool.slice(0, 2);
    }

    function populateLetters(word) {
      var letters = word.split("").concat(distractorLetters(word));
      shuffle(letters);
      draggableContainer.innerHTML = "";

      letters.forEach(function(letter) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "letter-chip";
        button.setAttribute("draggable", "true");
        button.textContent = letter.toUpperCase();
        button.dataset.letter = letter;

        button.addEventListener("click", function() {
          placeLetter(letter);
        });

        button.addEventListener("dragstart", function(event) {
          event.dataTransfer.setData("text/plain", letter);
        });

        draggableContainer.appendChild(button);
      });
    }

    function updateDropzoneMessage() {
      var helper = dropzone.querySelector("p");
      helper.style.display = placedLetters.children.length ? "none" : "block";
    }

    function placeLetter(letter) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "letter-chip";
      chip.textContent = letter.toUpperCase();
      chip.dataset.letter = letter;
      chip.addEventListener("click", function() {
        chip.remove();
        updateDropzoneMessage();
      });
      placedLetters.appendChild(chip);
      updateDropzoneMessage();
    }

    function clearPlacedLetters() {
      placedLetters.innerHTML = "";
      updateDropzoneMessage();
    }

    function celebrate() {
      if (window.confetti) {
        confetti({
          particleCount: 40,
          spread: 90,
          origin: { y: 0.6 }
        });
      }
    }

    dropzone.addEventListener("dragover", function(event) {
      event.preventDefault();
      dropzone.classList.add("hover");
    });

    dropzone.addEventListener("dragleave", function() {
      dropzone.classList.remove("hover");
    });

    dropzone.addEventListener("drop", function(event) {
      event.preventDefault();
      dropzone.classList.remove("hover");
      placeLetter(event.dataTransfer.getData("text/plain"));
    });

    checkWordButton.addEventListener("click", function() {
      var formedWord = Array.from(placedLetters.children)
        .map(function(child) {
          return child.dataset.letter;
        })
        .join("");

      if (formedWord === currentWord()) {
        feedbackMessage.textContent = 'Correct! You built "' + formedWord.toUpperCase() + '".';
        feedbackMessage.className = "message correct";
        celebrate();
      } else {
        feedbackMessage.textContent = "Not quite yet. Try again or tap Reset.";
        feedbackMessage.className = "message incorrect";
      }
    });

    clearWordButton.addEventListener("click", function() {
      clearPlacedLetters();
      feedbackMessage.textContent = "";
      feedbackMessage.className = "message";
    });

    nextWordButton.addEventListener("click", function() {
      currentWordIndex = (currentWordIndex + 1) % correctWords.length;
      renderCurrentWord();
    });
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1ZCM5PW9N9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "G-1ZCM5PW9N9");
  </script>
</body>
</html>
