<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="validate.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.6/angular.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.0.1"></script>
<script src="script.js"></script>
<title>Interactive Whiteboard</title>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background-image: url('images/rainbow1.jpeg');
    background-size: cover;
    background-attachment: fixed;
    background-position: center;
    margin: 0;
  }

  .game {
    margin: 2vh auto;
    padding: 3vh;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 24px;
    background: rgba(10, 15, 30, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    width: 95%;
    max-width: 900px;
    text-align: center;
    color: #fff;
  }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
    align-items: center;
    flex-wrap: wrap;
    background-color: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 15px;
    border-radius: 20px;
  }

  .tool {
    background: rgba(10, 15, 30, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 2vh;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    font-family: 'Inter', sans-serif;
  }

  .tool:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    background: rgba(20, 25, 45, 0.7);
  }

  #colorPicker {
    width: 50px;
    height: 50px;
    padding: 0;
    border: 2px solid white;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    background: transparent;
  }

  #colorPicker::-webkit-color-swatch-wrapper {
    padding: 0;
  }

  #colorPicker::-webkit-color-swatch {
    border: none;
    border-radius: 50%;
  }

  canvas {
    background: rgba(255, 255, 255, 0.95);
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    touch-action: none;
    margin: 0 auto;
    cursor: crosshair;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }
</style>
<body ng-app="newApp">
  
    <div ng-controller="appCtrl" id="controller" style="padding-bottom: 20px;">
     <div class="header">
      <h1>Interactive Whiteboard</h1>
      <a href="index.html">Go to Home</a>
    </div>
    <loader id="loader"></loader>
  <div class="game">
    <div class="toolbar">
      <button id="draw" class="tool">✏️ Draw</button>
      <button id="erase" class="tool">🧽 Erase</button>
      <input type="color" id="colorPicker" value="#000000">
      <input type="range" id="thickness" class="tool" min="1" max="20" value="5">
      <button id="clear" class="tool">🗑️ Clear</button>
    </div>
    <canvas id="whiteboard"></canvas>
  </div>
  </div>
  <script>

var app = angular.module("newApp", []);
app.directive('loader', function($http, $templateCache) {
return {
  restrict: 'E',
  link: function(scope, element) {
    // Load the loader.html file and inject it
    $http.get('loader.html', { cache: $templateCache }).then(function(response) {
      element.html(response.data);
    });
  }
};
});

app.controller('appCtrl', function($scope) {
$scope.ctrl = {showSmall:true, showCaps:true, busyPlay:false};
$scope.chars = [];

$scope.showSmallClck = function(){
  //$scope.aud.play();
  $scope.ctrl.showSmall = !$scope.ctrl.showSmall;
  if(!$scope.ctrl.showSmall && !$scope.ctrl.showCaps)
    $scope.ctrl.showCaps = true;
};

const canvas = document.getElementById('whiteboard');
const ctx = canvas.getContext('2d');
const drawButton = document.getElementById('draw');
const eraseButton = document.getElementById('erase');
const clearButton = document.getElementById('clear');
const colorPicker = document.getElementById('colorPicker');
const thickness = document.getElementById('thickness');

let isDrawing = false;
let isErasing = false;
let startX = 0;
let startY = 0;

$scope.initiate = function(data){
 // Initialize SVG
 $('#loader').hide();
 setTimeout(resizeCanvas, 100);
}


// Resize canvas to fit screen
function resizeCanvas() {
  if (canvas.offsetWidth > 0 && canvas.offsetHeight > 0) {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
  }
}
setTimeout(resizeCanvas, 100);
window.addEventListener('resize', resizeCanvas);

// Start drawing
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('touchstart', (e) => {
    if(e.cancelable) e.preventDefault();
    startDrawing(e.touches[0]);
}, {passive: false});

// Stop drawing
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseout', stopDrawing);
canvas.addEventListener('touchend', stopDrawing);

// Drawing on canvas
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('touchmove', (e) => {
    if(e.cancelable) e.preventDefault();
    draw(e.touches[0]);
}, {passive: false});

function startDrawing(e) {
  isDrawing = true;
  ctx.beginPath();
  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches.length > 0 ? e.touches[0].clientX : 0);
  const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches.length > 0 ? e.touches[0].clientY : 0);
  startX = clientX - rect.left;
  startY = clientY - rect.top;
  ctx.moveTo(startX, startY);
}

function stopDrawing() {
  isDrawing = false;
  ctx.beginPath();
}

function draw(e) {
  if (!isDrawing) return;
  if (typeof e.preventDefault === 'function') {
      e.preventDefault();
  }

  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches.length > 0 ? e.touches[0].clientX : 0);
  const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches.length > 0 ? e.touches[0].clientY : 0);
  
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  ctx.lineWidth = thickness.value;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (isErasing) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 20;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = colorPicker.value;
  }

  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);
}

// Erase button functionality
eraseButton.addEventListener('click', () => {
  isErasing = true;
});

// Draw button functionality
drawButton.addEventListener('click', () => {
  isErasing = false;
});

// Clear the canvas
clearButton.addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});

});
  </script>
</body>
</html>
