<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonics Sounds for Kids</title>
  <script>
    window.AFORAPPLE_SAMPLE_DATA = (function() {
      var categories = ["Short Vowels", "Beginning Sounds", "Blends", "Digraphs"];
      var items = {
        ShortVowels: ["A as in Apple", "E as in Egg", "O as in Orange"],
        BeginningSounds: ["B as in Ball", "M as in Mango", "S as in Sun"],
        Blends: ["Bl as in Blue", "St as in Star", "Tr as in Tree"],
        Digraphs: ["Ch as in Chair", "Sh as in Ship", "Th as in Thumb"]
      };
      var audTime = [];
      var start = 0;

      categories.forEach(function(category) {
        audTime.push({ s: start, e: start + 0.9 });
        start += 1.05;
        items[category.replace(/ /g, "")].forEach(function() {
          audTime.push({ s: start, e: start + 1.0 });
          start += 1.1;
        });
      });

      return {
        aud: "phonics.m4a",
        audTime: audTime,
        categories: categories,
        items: items,
        bg: ["class1.jpeg", "class2.jpeg", "class3.jpeg"]
      };
    })();
  </script>
  <script src="pilot-utils.js"></script>
  <script src="validate.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.6/angular.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.0.1"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .button {
      padding: 10px;
      font-size: 6vh;
      color: white;
      text-align: center;
    }

    .word-list {
      margin-top: 10px;
      font-size: 4vh;
      color: #fff;
    }

    #alphabet {
      grid-template-columns: repeat(auto-fit, minmax(35vh, 1fr));
      padding-top: 0;
    }

    body {
      background-image: url(images/class1.jpeg);
    }

    .category {
      padding: 20px;
    }

    .category h1 {
      color: brown;
      background: linear-gradient(40deg, #fdfbfb, transparent);
      padding: 10px 40px;
      font-size: 3.5vh;
      text-align: left;
    }

    .category h1:hover,
    .category h1:focus,
    .category h1.autoplay {
      transform: scale(1);
    }

    .toggle-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 20px;
    }

    .sample-banner {
      margin: 18px 20px 0;
      padding: 18px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 18px 36px rgba(21, 50, 75, 0.12);
      color: #15324b;
    }

    .sample-banner p {
      margin: 10px 0 0;
      font-size: 18px;
      line-height: 1.6;
    }

    .sample-banner a {
      color: #0f73b8;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body ng-app="newApp">
  <div ng-controller="appCtrl" id="controller">
    <div class="header">
      <h1>Phonics: Building Strong Reading Skills</h1>
      <a href="index.html">Go to Home</a>
    </div>

    <div class="sample-banner" data-access-badge-target>
      Public sample lesson. See how phonics works on a shared screen, then <a href="contact.html">request a school
      pilot</a> for the full library.
    </div>

    <div class="toggle-buttons">
      <button class="toggle-button play active">Play</button>
      <button
        class="toggle-button"
        ng-repeat="c in categories"
        ng-class="{'active':!ctrl[c.replaceAll(' ','')]}"
        ng-click="ctrl[c.replaceAll(' ','')]=!ctrl[c.replaceAll(' ','')]"
      >
        <span ng-hide="ctrl[c.replaceAll(' ','')]">Hide</span>
        <span ng-show="ctrl[c.replaceAll(' ','')]">Show</span>
        {{c}}
      </button>
    </div>
    <loader id="loader"></loader>
    <div ng-repeat="c in categories" ng-hide="ctrl[c.replaceAll(' ','')]" class="category">
      <h1 data="{{counts[c.replaceAll(' ','')]-1}}" class="button" style="margin: 60px;">{{c}}</h1>
      <div id="alphabet" class="shapes-grid">
        <div class="button ng-cloak" ng-repeat="v in items[c.replaceAll(' ','')]" data="{{counts[c.replaceAll(' ','')]+$index}}">
          <h2 style="margin: 20px;">{{v.split(" as in ")[0]}}</h2>
          <div class="word-list">{{v.split(" as in ")[1]}}</div>
        </div>
      </div>
    </div>
  </div>
  <button id="scrollToTopBtn" title="Go to top">Top</button>
  <script src="script.js"></script>
  <script>
    var aud;
    var audTime = [];
    gap = 2300;
    var app = angular.module("newApp", []);

    app.directive("loader", function($http, $templateCache) {
      return {
        restrict: "E",
        link: function(scope, element) {
          $http.get("loader.html", { cache: $templateCache }).then(function(response) {
            element.html(response.data);
          });
        }
      };
    });

    app.controller("appCtrl", function($scope) {
      $scope.items = {};
      $scope.ctrl = {};
      $scope.counts = {};
      $scope.categories = [];

      $scope.setCounts = function() {
        var i;
        var c = 0;
        for (i = 0; i < $scope.categories.length; i++) {
          $scope.counts[$scope.categories[i].replaceAll(" ", "")] = c + i + 1;
          c += $scope.items[$scope.categories[i].replaceAll(" ", "")].length;
        }
        $scope.counts.cat = c;
      };

      $scope.initiate = function(data) {
        aud = new Audio(data.aud);
        audTime = data.audTime;
        $("#loader").hide();
        $scope.categories = data.categories;
        $scope.items = data.items;
        $scope.setCounts();
      };
    });
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1ZCM5PW9N9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "G-1ZCM5PW9N9");
  </script>
</body>
</html>
