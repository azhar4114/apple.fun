<!DOCTYPE html>
<html>
  <head>
	  <script src="validate.js"></script>
	<link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.6/angular.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Learn Days of Week</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('images/space1.jpeg');
      background-size: cover;
      background-attachment: fixed;
    }

    #alphabet {
      grid-template-columns: repeat(auto-fit, minmax(28vh, 1fr));
      gap: 3vh;
      padding: 0 4vh;
    }
    
    .button {
      padding: 3vh;
      font-size: 3.5vh;
      font-weight: 800;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
      text-transform: capitalize;
      height: 18vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
  </style>
  </head>
<body ng-app="newApp">
  
  <div ng-controller="appCtrl" id="controller">
   <div class="header">
    <h1>Learn Days of Week</h1>
    <a href="index.html">Go to Home</a>
  </div>
  <div class="toggle-buttons">
   <button class="toggle-button play active">Play</button>
  </div>
  <loader id="loader"></loader>
    <div id="alphabet">
      <div class="button ng-cloak" ng-repeat="l in chars" data="{{$index}}"><div ><span>{{l}}</span></div></div>
    </div>
      
    </div>
<button id="scrollToTopBtn" title="Go to top">Top</button>
<script src="script.js"></script>
  <script>
var aud;
var audTime = [];
gap = 2000;

var app = angular.module("newApp", []);

app.directive('loader', function($http, $templateCache) {
  return {
    restrict: 'E',
    link: function(scope, element) {
      // Load the loader.html file and inject it
      $http.get('loader.html', { cache: $templateCache }).then(function(response) {
        element.html(response.data);
      });
    }
  };
});


app.controller('appCtrl', function($scope, $timeout) {
  $scope.ctrl = {showSmall:true, showCaps:true, busyPlay:false};
  $scope.chars = [];
  
  $scope.showSmallClck = function(){
    //$scope.aud.play();
	  $scope.ctrl.showSmall = !$scope.ctrl.showSmall;
    if(!$scope.ctrl.showSmall && !$scope.ctrl.showCaps)
      $scope.ctrl.showCaps = true;
  };
  
  $scope.initiate = function(data){
 	 aud = new Audio(data.aud);
     aud.load();
 	 audTime = data.audTime;
  	 $('#loader').hide();
 	 $scope.chars = data.chars;

     $timeout(function() {
         if (typeof attachListeners === 'function') attachListeners();
     }, 500);
  }

  
}); 


  </script>
<script src="script.js"></script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-1ZCM5PW9N9');
</script>
</body>
</html>
