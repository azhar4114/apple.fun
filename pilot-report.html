<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilot Usage Report | Aforapple.fun</title>
  <meta name="description" content="Export the local pilot usage report for Aforapple.fun classroom trials.">
  <script src="pilot-utils.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('images/space1.jpeg');
      background-size: cover;
      background-attachment: fixed;
      color: #fff;
    }

    .summary {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      margin-top: 24px;
    }

    .summary div {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .summary strong {
      display: block;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 6px;
    }

    .summary span {
      font-size: 24px;
      font-weight: 700;
      color: #ff9a9e;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .button {
      border: none;
      border-radius: 15px;
      padding: 12px 24px;
      background: linear-gradient(45deg, #a18cd1, #fbc2eb);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(251, 194, 235, 0.5);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pilot Usage Report</h1>
    <a href="index.html">Go to Home</a>
  </div>

  <div class="content-card">
    <h2>Device pilot usage report</h2>
    <p>
      This page shows the local usage report stored on this device during a classroom pilot. You can export JSON or CSV
      for manual follow-up and review.
    </p>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button class="button" id="export-json">Export JSON</button>
      <button class="button" id="export-csv">Export CSV</button>
    </div>
  </div>

  <div class="content-card">
    <h2>Lesson activity</h2>
    <table>
      <thead>
        <tr>
          <th>Lesson</th>
          <th>Access state</th>
          <th>Sessions</th>
          <th>First seen</th>
          <th>Last seen</th>
        </tr>
      </thead>
      <tbody id="report-body"></tbody>
    </table>
  </div>
  <button id="scrollToTopBtn" title="Go to top">Top</button>
  <script src="script.js"></script>

  <script>
    var report = AFORAPPLE_UTILS.getReport();
    var summary = document.getElementById("summary");
    var body = document.getElementById("report-body");
    var lessonKeys = Object.keys(report.lessonVisits);
    var totalSessions = lessonKeys.reduce(function(sum, key) {
      return sum + report.lessonVisits[key].sessionCount;
    }, 0);

    summary.innerHTML = [
      "<div><strong>Access state</strong><span>" + (report.accessState || "sample") + "</span></div>",
      "<div><strong>Device ID</strong><span>" + report.deviceId + "</span></div>",
      "<div><strong>Lessons opened</strong><span>" + lessonKeys.length + "</span></div>",
      "<div><strong>Total sessions</strong><span>" + totalSessions + "</span></div>"
    ].join("");

    if (!lessonKeys.length) {
      body.innerHTML = "<tr><td colspan='5'>No lesson activity has been recorded on this device yet.</td></tr>";
    } else {
      lessonKeys.sort().forEach(function(key) {
        var item = report.lessonVisits[key];
        var row = document.createElement("tr");
        row.innerHTML = [
          "<td>" + item.title + "</td>",
          "<td>" + item.accessState + "</td>",
          "<td>" + item.sessionCount + "</td>",
          "<td>" + item.firstSeen + "</td>",
          "<td>" + item.lastSeen + "</td>"
        ].join("");
        body.appendChild(row);
      });
    }

    document.getElementById("export-json").addEventListener("click", function() {
      AFORAPPLE_UTILS.exportReportAsJson();
    });

    document.getElementById("export-csv").addEventListener("click", function() {
      AFORAPPLE_UTILS.exportReportAsCsv();
    });
  </script>
</body>
</html>
