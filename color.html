<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<title>Interactive Coloring Page</title>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background-image: url('images/rainbow2.jpeg');
    background-size: cover;
    background-attachment: fixed;
    background-position: center;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .header {
    width: 100%;
    margin-bottom: 2vh;
  }

  .game {
    margin: 2vh auto;
    padding: 4vh;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 24px;
    background: rgba(10, 15, 30, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    width: 90%;
    max-width: 600px;
    text-align: center;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  canvas {
    border: none;
    border-radius: 16px;
    background-color: rgba(255, 255, 255, 0.95);
    margin-top: 20px;
    cursor: crosshair;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    max-width: 100%;
  }

  .controls {
    margin-top: 10px;
    margin-bottom: 10px;
    background-color: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    width: 100%;
    box-sizing: border-box;
  }

  .controls p {
    margin-top: 15px;
    font-weight: 600;
  }

  .controls button {
    background: rgba(10, 15, 30, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 2vh;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    margin: 5px;
  }

  .controls button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    background: rgba(20, 25, 45, 0.7);
  }

  .color-picker {
    width: 50px;
    height: 50px;
    padding: 0;
    border: 2px solid white;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    background: transparent;
    vertical-align: middle;
    margin: 5px 15px;
  }

  .color-picker::-webkit-color-swatch-wrapper {
    padding: 0;
  }

  .color-picker::-webkit-color-swatch {
    border: none;
    border-radius: 50%;
  }

  .file-input {
    margin: 15px 0;
    font-family: 'Inter', sans-serif;
  }

  .image-selection {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
    gap: 15px;
  }

  .image-selection img {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    object-fit: contain;
    background: rgba(255, 255, 255, 0.9);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    border: 2px solid transparent;
  }

  .image-selection img:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    border-color: #ff9a9e;
  }
</style>
<script src="validate.js"></script>
</head>
<body>

  <div class="header">
    <h1>Interactive Coloring Page</h1>
    <a href="index.html">Go to Home</a>
  </div>

<div class="game">
  <div class="controls">
    <input type="color" id="colorPicker" value="#ff0000" class="color-picker">
    <button type="button" onclick="clearCanvas()">Clear</button>
    <button type="button" onclick="downloadCanvas()">Download</button>
    <br>
    <input type="file" id="imageLoader" name="imageLoader" class="file-input">
    <p>Upload an image or pick a template and start coloring!</p>
  </div>

  <canvas id="coloringCanvas" width="400" height="400"></canvas>
  
  <div class="image-selection">
      <img src="images/a-apple.jpeg" onclick="loadImage(this.src)" alt="A Apple">
    <img src="images/app.jpeg" onclick="loadImage(this.src)" alt="Apple">
    <img src="images/car1.jpeg" onclick="loadImage(this.src)" alt="Car">
    <img src="images/car2.jpeg" onclick="loadImage(this.src)" alt="Car">
    <img src="images/carrt.jpeg" onclick="loadImage(this.src)" alt="Carrot">
    <img src="images/flower1.jpeg" onclick="loadImage(this.src)" alt="Flower">
    <img src="images/house1.jpeg" onclick="loadImage(this.src)" alt="House">
    <img src="images/house2.jpeg" onclick="loadImage(this.src)" alt="House">
    <img src="images/house3.jpeg" onclick="loadImage(this.src)" alt="House">
    <img src="images/oran.jpeg" onclick="loadImage(this.src)" alt="Orange">
    <img src="images/pump.jpeg" onclick="loadImage(this.src)" alt="Pumpkin">
      <img src="images/straw.jpeg" onclick="loadImage(this.src)" alt="Strawberry">
      <img src="images/tomato1.jpeg" onclick="loadImage(this.src)" alt="Tomato">
  </div>
</div>
<script>
  const canvas = document.getElementById('coloringCanvas');
  const ctx = canvas.getContext('2d');
  const colorPicker = document.getElementById('colorPicker');
  const imageLoader = document.getElementById('imageLoader');
  let drawing = false;
  let img = new Image();

  imageLoader.addEventListener('change', handleImage, false);

  function handleImage(e) {
    const reader = new FileReader();
    reader.onload = function(event) {
      img.onload = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      img.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
  }

  function startDrawing(event) {
    drawing = true;
    draw(event);
  }

function loadImage(src) {
    img.src = src;
    img.onload = function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
  }

  function stopDrawing() {
    drawing = false;
    ctx.beginPath();
  }

  function draw(event) {
    if (!drawing) return;

    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';

    let x, y;

    if (event.type.includes('touch')) {
      const touch = event.touches[0];
      const rect = canvas.getBoundingClientRect();
      x = touch.clientX - rect.left;
      y = touch.clientY - rect.top;
    } else {
      const rect = canvas.getBoundingClientRect();
      x = event.clientX - rect.left;
      y = event.clientY - rect.top;
    }

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);

    event.preventDefault();
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (img.src) {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
  }

  function downloadCanvas() {
    const link = document.createElement('a');
    link.download = 'drawing.png';
    link.href = canvas.toDataURL();
    link.click();
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseout', stopDrawing);
  canvas.addEventListener('mousemove', draw);

  canvas.addEventListener('touchstart', startDrawing);
  canvas.addEventListener('touchend', stopDrawing);
  canvas.addEventListener('touchcancel', stopDrawing);
  canvas.addEventListener('touchmove', draw);
</script>

</body>
</html>
